<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>중앙탑고등학교 급식 🍱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">
    
    <!-- 주아(Jua)체 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --point-color: #ff9a76;
            --sub-color: #ffeadb;
        }
        body { 
            background: linear-gradient(135deg, #fff5e1 0%, #ffdde1 100%);
            font-family: 'Jua', sans-serif; /* 글씨체 변경 */
            min-height: 100vh; padding: 20px 10px;
            display: flex; flex-direction: column; align-items: center;
        }
        .meal-card { 
            width: 100%; max-width: 450px; border-radius: 30px; border: none;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(255, 154, 118, 0.2); padding: 25px;
            position: relative;
        }
        .school-header { margin-bottom: 25px; text-align: center; }
        .school-name { font-size: 1.8rem; color: #555; }
        
        .date-section { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #fff; padding: 12px; border-radius: 20px;
            margin-bottom: 20px; border: 3px dashed var(--point-color);
        }
        .date-wrapper { display: flex; align-items: center; gap: 3px; }
        .date-picker-input {
            border: none; font-family: 'Jua', sans-serif; font-size: 1.2rem; 
            width: 140px; text-align: center; outline: none; background: transparent;
            color: #444;
        }
        #day-display {
            font-size: 1.2rem; color: var(--point-color);
        }
        .nav-btn { 
            background-color: var(--point-color); color: white; border: none; 
            border-radius: 15px; padding: 6px 14px; font-size: 1rem;
            box-shadow: 0 4px 0px #e67e5c; transition: 0.1s;
        }
        .nav-btn:active { transform: translateY(3px); box-shadow: none; }

        .meal-section {
            background: #fff; border-radius: 20px; padding: 18px;
            margin-bottom: 15px; border: 2px solid var(--sub-color);
        }
        .meal-type { font-size: 1.2rem; margin-bottom: 12px; display: flex; justify-content: space-between; color: #666; }
        .kcal-badge { font-size: 0.9rem; background: var(--sub-color); color: var(--point-color); padding: 4px 12px; border-radius: 15px; }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        .food-item { 
            position: relative;
            background: #fff; border: 2px solid #fdf2e9; border-radius: 15px;
            padding: 14px 5px; font-size: 1.1rem; color: #555; text-align: center;
            cursor: pointer; transition: 0.2s;
        }
        .food-item:hover { background-color: #fffaf0; }
        .food-item:active { background-color: var(--sub-color); transform: scale(0.95); }

         .allergy-bubble {
            position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            background: #5d5d5d; color: #fff; padding: 10px 15px; border-radius: 15px;
            font-size: 0.9rem; font-family: 'Jua', sans-serif; width: max-content;
            max-width: 180px; z-index: 100; pointer-events: none;
            display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            line-height: 1.4;
        }
        .allergy-bubble::after {
            content: ''; position: absolute; top: 100%; left: 50%;
            margin-left: -8px; border-width: 8px; border-style: solid;
            border-color: #5d5d5d transparent transparent transparent;
        }
        .show-bubble .allergy-bubble { display: block; animation: pop 0.3s ease-out; }

        @keyframes pop {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        .no-meal { padding: 40px; text-align: center; color: #bbb; font-size: 1.3rem; }
    </style>
</head>
<body onclick="hideAllBubbles()">

    <div class="meal-card" onclick="event.stopPropagation()">
        <div class="school-header">
            <h1 class="school-name">🍱 중앙탑고 급식 🍱</h1>
        </div>

        <div class="date-section">
            <button class="nav-btn" onclick="changeDate(-1)">이전</button>
            <div class="date-wrapper">
                <input type="date" id="date-input" class="date-picker-input" onchange="updateMeal()">
                <span id="day-display"></span>
            </div>
            <button class="nav-btn" onclick="changeDate(1)">다음</button>
        </div>

        <div id="meal-container"></div>
    </div>

    <script>
        const API_KEY = "94dd3b88730f49469b6245d9c213b99c"; 
        const currentAtptCode = "M10";
        const currentSchulCode = "8000531";

        const allergyMap = { 1: "난류", 2: "우유", 3: "메밀", 4: "땅콩", 5: "대두", 6: "밀", 7: "고등어", 8: "게", 9: "새우", 10: "돼지고기", 11: "복숭아", 12: "토마토", 13: "아황산류", 14: "호두", 15: "닭고기", 16: "쇠고기", 17: "오징어", 18: "조개류", 19: "잣" };
        const week = ['일', '월', '화', '수', '목', '금', '토'];

        function init() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            const localDate = new Date(now.getTime() - offset);
            document.getElementById('date-input').value = localDate.toISOString().split('T')[0];
            updateMeal();
        }

        function hideAllBubbles() {
            document.querySelectorAll('.food-item').forEach(el => el.classList.remove('show-bubble'));
        }

        function toggleBubble(event, element) {
            event.stopPropagation();
            const isShowing = element.classList.contains('show-bubble');
            hideAllBubbles();
            if (!isShowing) element.classList.add('show-bubble');
        }

        async function updateMeal() {
            const dateInput = document.getElementById('date-input').value;
            const container = document.getElementById('meal-container');
            const dayDisplay = document.getElementById('day-display');

            const d = new Date(dateInput);
            dayDisplay.innerText = `(${week[d.getDay()]})`;

            container.innerHTML = "<div class='no-meal'>맛있는 급식 찾는 중... 🍳</div>";
            
            try {
                const res = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${currentAtptCode}&SD_SCHUL_CODE=${currentSchulCode}&MLSV_YMD=${dateInput.replace(/-/g, "")}`);
                const data = await res.json();

                if (data.mealServiceDietInfo) {
                    let html = "";
                    data.mealServiceDietInfo[1].row.forEach(row => {
                        html += `
                            <div class="meal-section">
                                <div class="meal-type"><span>✨ ${row.MMEAL_SC_NM}</span><span class="kcal-badge">${row.CAL_INFO}</span></div>
                                <div class="menu-grid">
                        `;
                        row.DDISH_NM.split("<br/>").forEach(item => {
                            const allMatch = item.match(/\(([\d.]+)\)$/);
                            const allergyNums = allMatch ? allMatch[1] : "";
                            const cleanName = item.replace(/\(([\d.]+)\)$/, "").replace(/\*/g, "").trim();
                            const allergyInfo = allergyNums ? allergyNums.split('.').map(n => allergyMap[n.trim()]).filter(v => v).join(", ") : "정보 없음";

                            html += `
                                <div class="food-item" onclick="toggleBubble(event, this)">
                                    ${cleanName}
                                    <div class="allergy-bubble">📋 알레르기: ${allergyInfo}</div>
                                </div>`;
                        });
                        html += `</div></div>`;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = "<div class='no-meal'>오늘은 급식이 없어요 🏖️</div>";
                }
            } catch (err) {
                container.innerHTML = "<div class='no-meal'>정보를 불러올 수 없어요 ㅠ</div>";
            }
        }

        function changeDate(days) {
            let d = new Date(document.getElementById('date-input').value);
            d.setDate(d.getDate() + days);
            document.getElementById('date-input').value = d.toISOString().split('T')[0];
            updateMeal();
        }

        init();
    </script>
</body>
</html>
